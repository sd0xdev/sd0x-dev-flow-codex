name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node 24 LTS
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Fetch migration evidence
        run: >-
          git fetch --no-tags origin
          +refs/sd0x-dev-flow-codex/evidence/v1:refs/sd0x-dev-flow-codex/evidence/v1
          '+refs/sd0x-dev-flow-codex/subjects/*:refs/sd0x-dev-flow-codex/subjects/*'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Check code and release contract
        run: |
          npm run check
          npm run release:check

  migration-replay:
    name: Exhaustive migration replay
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Fetch migration evidence
        run: >-
          git fetch --no-tags origin
          +refs/sd0x-dev-flow-codex/evidence/v1:refs/sd0x-dev-flow-codex/evidence/v1
          '+refs/sd0x-dev-flow-codex/subjects/*:refs/sd0x-dev-flow-codex/subjects/*'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Replay migration evidence transitions
        run: npm run check:migration-replay

  windows-bound-tree:
    name: Native Windows bound-tree
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Verify platform-normalized tree modes
        shell: pwsh
        run: |
          $output = & node --test --test-reporter=tap `
            --test-name-pattern 'native Windows|generation lookup fails' `
            test/skill-migration.test.js 2>&1
          $exitCode = $LASTEXITCODE
          $output | Write-Output
          if ($exitCode -ne 0) {
            exit $exitCode
          }
          $text = $output -join "`n"
          if ($text -notmatch '(?m)^ok \d+ - bound tree write and link support native Windows mode semantics$') {
            throw 'Native Windows bound-tree mode test did not run to completion.'
          }
          if ($text -notmatch '(?m)^ok \d+ - candidate transaction acquisition supports native Windows process identity$') {
            throw 'Native Windows candidate transaction test did not run to completion.'
          }
          if ($text -notmatch '(?m)^ok \d+ - candidate transaction preserves an active lease when generation lookup fails$') {
            throw 'Native Windows unknown-generation test did not run to completion.'
          }
          if ($text -notmatch '(?m)^ok \d+ - native Windows closed Git environments support request tool and audits$') {
            throw 'Native Windows closed-Git environment test did not run to completion.'
          }
